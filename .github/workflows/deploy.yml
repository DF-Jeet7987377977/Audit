name: Deploy to salesaudit.dreamfolks.co.in

# Copies the site files to the nginx server over SSH on every push to main,
# then checks that the live site serves the new version.
# Setup (server user, key, secrets): see IT-SETUP.md, "Automatic deployment".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-salesaudit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      SITE_URL: https://salesaudit.dreamfolks.co.in
    steps:
      - name: Check deployment secrets
        id: secrets
        run: |
          missing=""
          for s in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do [ -z "${!s}" ] && missing="$missing $s"; done
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ] && missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::notice title=Deployment skipped::Repository secrets not set yet:$missing. See IT-SETUP.md > Automatic deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Check the files to deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          test -f index.html && test -f config.js && test -f vendor/msal-browser-2.38.3.min.js
          if grep -q 'REPLACE-WITH' config.js; then echo "::error::config.js still has a placeholder value"; exit 1; fi

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy files to the server
        if: steps.secrets.outputs.ready == 'true'
        run: |
          PORT="${DEPLOY_PORT:-22}"
          SSH="ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # Only the site's own files; anything else in the web root is left alone.
          rsync -rvz --checksum --chmod=D755,F644 -e "$SSH" \
            index.html config.js vendor \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Check the live site
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sleep 3
          want=$(grep -o 'clientId: "[^"]*"' config.js)
          got=$(curl -fsS "$SITE_URL/config.js?v=$GITHUB_SHA" | grep -o 'clientId: "[^"]*"' || true)
          [ "$want" = "$got" ] || { echo "::error::Live config.js does not match ($got)"; exit 1; }
          curl -fsS -o /dev/null "$SITE_URL/vendor/msal-browser-2.38.3.min.js?v=$GITHUB_SHA" || { echo "::error::Live site is missing vendor/msal-browser-2.38.3.min.js"; exit 1; }
          curl -fsS "$SITE_URL/?v=$GITHUB_SHA" | grep -q 'vendor/msal-browser-2.38.3.min.js' || { echo "::error::Live index.html is not the new version"; exit 1; }
          echo "Live site is up to date."
