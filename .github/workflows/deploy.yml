name: Deploy to salesaudit.dreamfolks.co.in

# On every push to main: copy the page to the nginx web root and the /api helper + users.json
# to the service folder, restart the helper, then check the live site.
# One-time server setup: IT-SETUP.md.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-salesaudit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}            # nginx web root, e.g. /var/www/salesaudit
      DEPLOY_API_PATH: ${{ secrets.DEPLOY_API_PATH }}    # service folder, e.g. /opt/callaudit
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      SITE_URL: https://salesaudit.dreamfolks.co.in
    steps:
      - name: Check deployment secrets
        id: secrets
        run: |
          missing=""
          for s in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_API_PATH; do [ -z "${!s}" ] && missing="$missing $s"; done
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ] && missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::notice title=Deployment skipped::Repository secrets not set yet:$missing. See IT-SETUP.md > Automatic deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Check the files to deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          test -f index.html && test -f config.js && test -f api/server.py && test -f users.json
          python3 -c "import json; d=json.load(open('users.json')); assert all(u['password'].startswith('pbkdf2_sha256\$') for u in d['users']), 'users.json has a password that is not hashed'"
          python3 -m py_compile api/server.py

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy files to the server
        if: steps.secrets.outputs.ready == 'true'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # page -> web root (nothing else there is touched)
          rsync -rvz --checksum --chmod=D755,F644 -e "$SSH" index.html config.js "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # helper + users -> service folder (not web-served)
          rsync -rvz --checksum --chmod=D750,F640 -e "$SSH" api users.json requirements.txt "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_API_PATH/"
          # restart only when the helper code changed; users.json is picked up without a restart
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n /bin/systemctl restart callaudit-api"

      - name: Check the live site
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sleep 4
          curl -fsS "$SITE_URL/?v=$GITHUB_SHA" | grep -q 'id="login-form"' || { echo "::error::Live index.html is not the new version"; exit 1; }
          curl -fsS "$SITE_URL/api/ping" | tee /dev/stderr | grep -q '"ok": true' || { echo "::error::The /api helper is not answering on the live site"; exit 1; }
          echo "Live site and /api helper are up."
