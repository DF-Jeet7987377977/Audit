# Add inside the existing server { } block for salesaudit.dreamfolks.co.in
# (the one that already serves index.html), then: sudo nginx -t && sudo systemctl reload nginx

    # The audit service (api/server.py)
    location /api/ {
        proxy_pass         http://127.0.0.1:8770;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 20m;   # lead pool upload (leads.json is ~2.5 MB)
    }

    # Never serve server-side files if they end up in the web root by mistake
    location ~ ^/(api/.*\.py|users\.json|deploy/|tools/) { return 404; }
